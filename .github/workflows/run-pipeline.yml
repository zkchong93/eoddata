name: Run EOD pipeline

on:
  schedule:
    # Target: ~11:00 AM Singapore/KL time (UTC+8, no DST). GitHub converts
    # to UTC internally and adjusts automatically across the US EDT/EST
    # boundary, so this single cron + timezone entry replaces the old
    # two-cron-plus-guard-job setup. Day-of-week is evaluated in Singapore's
    # calendar, so "Tue-Sat" here means Tue-Sat in Malaysia directly.
    - cron: "13 11 * * 2-6"
      timezone: "Asia/Singapore"
  workflow_dispatch: {}  # manual "Run workflow" button in the Actions tab

# Stop an overlapping run if the previous one is still going (e.g. a manual
# trigger fired while the scheduled run is mid-flight).
concurrency:
  group: eod-pipeline
  cancel-in-progress: false

# Actions runners are ephemeral -- nothing persists unless committed back.
permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      # Order matters: the fetcher must land the day's CSVs in EOD/ before the
      # daily/weekly builders read them, and both must run before the screener.
      # continue-on-error: a failed/rate-limited fetch still shows red in the
      # Actions UI, but must not stop the rest of the pipeline -- whatever CSVs
      # did land should still be built into the parquets and committed. The
      # fetcher re-checks a trailing window, so a missed day is retried on the
      # next run by itself.
      - name: Run 0_fetch_eod.py
        continue-on-error: true
        env:
          EODDATA_API_KEY: ${{ secrets.EODDATA_API_KEY }}
        run: python 0_fetch_eod.py

      # Refreshes etp_exclusions.csv (ETFs/ETNs that 3_screen.py must drop) from
      # Nasdaq's public symbol directory. continue-on-error for the same reason
      # as the fetcher above: the script already falls back to the committed
      # snapshot on a network failure, so a bad day upstream costs at most a
      # slightly stale exclusion list, never a broken pipeline.
      - name: Run 0b_fetch_symbol_types.py
        continue-on-error: true
        run: python 0b_fetch_symbol_types.py

      - name: Run 1_append_daily.py
        run: python 1_append_daily.py

      - name: Run 2_append_weekly.py
        run: python 2_append_weekly.py

      - name: Run 3_screen.py
        run: python 3_screen.py

      # Runner is ephemeral -- persist the regenerated parquet/csv outputs
      # back to the repo, or the next run starts from nothing.
      - name: Commit updated outputs
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Automated EOD pipeline run [skip ci]"
          # EOD/*.csv is included so the newly-fetched raw dailies persist --
          # 2_append_weekly.py reads them back on later runs to rebuild weeks.
          file_pattern: "*.parquet *.csv EOD/*.csv"
